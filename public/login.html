<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="imagenes/verity.png" type="image/x-icon">
    <title>Login - Click a Verity!</title>
</head>
<body>
    <section class="contenedor">
        <h1 id="tituloForm">Login</h1>
        <div class="contenedor-login">

            <div id="separacion-login">
                <form id="formulario" autocomplete="on">
                    <label for="usuario">Usuario:</label>
                    <input type="text" id="usuario" class="login" maxlength="25" autocomplete="username">
                    <label for="contrasena">Contraseña:</label>
                    <input type="password" id="contrasena" class="login" autocomplete="current-password">
                    <button type="submit" hidden></button>
                </form>
            </div>

            <!-- Verity es el boton: se "activa" por JS cuando los campos estan llenos -->
            <a href="#" id="botonEntrar"><img src="imagenes/verity.png" alt="Verity"></a>

        </div>

        <p id="mensaje" class="mensaje-login"></p>
        <button type="button" id="alternar" class="enlace-alternar">No tengo cuenta, registrarme</button>
    </section>

    <script src="sesion.js"></script>
    <script src="login.js"></script>
</body>
</html>
