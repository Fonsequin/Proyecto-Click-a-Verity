<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Usuario - Click a Verity</title>
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="imagenes/verity.png" type="image/x-icon">
</head>
<body>

  <header>
    <div class="nav-group">
      <a href="leaderboard.html">LEADERBOARD</a>
      <a href="estadisticas.html">ESTADISTICAS</a>
    </div>

    <div>
      <a href="index.html" class="titulo">CLICK A VERITY!</a> 
    </div>

    <div class="nav-group right">
      <a href="usuario.html" class="active">USUARIO</a>
      <a href="creditos.html">CREDITOS</a>
    </div>
  </header>

  <div class="pagina">
    <h1>usuario</h1>

    <div class="campo">
      <label>Nombre de usuario</label>
      <input type="text" id="campoNombre" disabled>
    </div>

    <div class="campo">
      <label>Fecha de registro</label>
      <input type="text" id="campoFecha" disabled>
    </div>

    <button class="boton-secundario" id="botonCerrarSesion">Cerrar sesion</button>
  </div>

  <script src="sesion.js"></script>
  <script>
    const sesion = requerirSesion();

    if (sesion) {
      document.querySelector("#campoNombre").value = sesion.nombre;

      fetch(`/usuarios/${sesion.usuarioID}`)
        .then(respuesta => {
          if (respuesta.status === 404) {
            cerrarSesion(); // la cuenta ya no existe
          }
          return respuesta.json();
        })
        .then(datos => {
          // la fecha viene como AAAA-MM-DD
          const [anio, mes, dia] = String(datos.fecha).slice(0, 10).split("-");
          document.querySelector("#campoFecha").value = `${dia}/${mes}/${anio}`;
        })
        .catch(() => {
          document.querySelector("#campoFecha").value = "No disponible";
        });
    }

    document.querySelector("#botonCerrarSesion").addEventListener("click", function () {
      cerrarSesion();
    });
  </script>

</body>
</html>
