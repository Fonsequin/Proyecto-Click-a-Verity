<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Click a Verity</title>
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="imagenes/verity.png" type="image/x-icon">
</head>
<body>
  <!--header o navbar-->
  <header>
    <div class="nav-group">
      <a href="leaderboard.html">LEADERBOARD</a>
      <a href="estadisticas.html">ESTADISTICAS</a>
    </div>

    <div class="titulo">CLICK A VERITY!</div>
    
    <div class="nav-group right">
      <a href="usuario.html">USUARIO</a>
      <a href="creditos.html">CREDITOS</a>
    </div>
  </header>
  <!--contenido-->
  <div class="contenido">
    <!--contenido de la columna izquierda-->
    <div class="columna col-izquierda">
    </div>

    <!--verity-->
    <div class="columna col-centro">
      <button class="boton-click" id="botonClick">
        <span class="cara-verity"></span>
      </button>
      <div class="contador">Puntos: <span id="contadorPuntos">0</span></div>
    </div>

    <!--columnas de mejora o columna derecha-->
    <div class="columna col-derecha">
      <div class="mejoras-titulo">MEJORAS</div>

      <div class="mejora">
        <h3>Click rapido</h3>
        <p>Click +1</p>
        <button id="mejora1" data-costo="20">Comprar (20 pts)</button>
      </div>

      <div class="mejora">
        <h3>Helpity</h3>
        <p>Suma 1 punto por segundo</p>
        <button id="mejora2" data-costo="50">Comprar (50 pts)</button>
      </div>

      <div class="mejora">
        <h3>Doble click</h3>
        <p>Duplica el valor actual de cada click</p>
        <button id="mejora3" data-costo="100">Comprar (100 pts)</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
