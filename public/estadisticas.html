<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Estadisticas - Click a Verity</title>
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="imagenes/verity.png" type="image/x-icon">
</head>
<body>

  <header>
    <div class="nav-group">
      <a href="leaderboard.html">LEADERBOARD</a>
      <a href="estadisticas.html" class="active">ESTADISTICAS</a>
    </div>

    <div>
      <a href="index.html" class="titulo">CLICK A VERITY!</a> 
    </div>

    <div class="nav-group right">
      <a href="usuario.html">USUARIO</a>
      <a href="creditos.html">CREDITOS</a>
    </div>
  </header>

  <div class="pagina">
    <h1>estadisticas</h1>

    <div class="grilla-stats">
      <div class="caja">
        <div class="stat-numero" id="statPuntosTotales">-</div>
        <div class="stat-label">Puntos totales</div>
      </div>

      <div class="caja">
        <div class="stat-numero" id="statClicks">-</div>
        <div class="stat-label">Clicks totales</div>
      </div>

      <div class="caja">
        <div class="stat-numero" id="statMejoras">-</div>
        <div class="stat-label">Mejoras compradas</div>
      </div>

      <div class="caja">
        <div class="stat-numero" id="statTiempo">-</div>
        <div class="stat-label">Tiempo jugado</div>
      </div>

      <div class="caja">
        <div class="stat-numero" id="statPuntosClick">-</div>
        <div class="stat-label">Puntos por click</div>
      </div>

      <div class="caja">
        <div class="stat-numero" id="statPuntosSegundo">-</div>
        <div class="stat-label">Puntos por segundo</div>
      </div>

      <div class="caja">
        <div class="stat-numero" id="statLogros">-</div>
        <div class="stat-label">Logros desbloqueados</div>
      </div>

      <div class="caja">
        <div class="stat-numero" id="statPuesto">-</div>
        <div class="stat-label">Puesto en el leaderboard</div>
      </div>
    </div>
    <p class="stat-label" id="estado"></p>
  </div>

  <script src="sesion.js"></script>
  <script src="estadisticas.js"></script>
</body>
</html>
